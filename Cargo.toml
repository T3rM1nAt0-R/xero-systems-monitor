[workspace]
resolver = "2"
members = [
    "crates/xsm-core",
    "crates/xsm-settings",
    "crates/xsm-store",
    "crates/xsm-sources",
    "crates/xsm-collector",
    "crates/xsm-walls",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
walkdir = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
