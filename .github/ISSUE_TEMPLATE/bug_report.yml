name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: App version and OS (for example 0.1.0, Windows 11 24H2)
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Please remove host names, IP addresses and user names from logs and screenshots before posting."
