name: Release
# Pushing a tag like v0.1.0 builds the Windows installers and opens a DRAFT GitHub Release.
# Publish the draft by hand after trying the installer. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release and attach the installers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tag must match the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the version $version in Cargo.toml"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the window
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the Tauri command line tool
        run: cargo install tauri-cli --version "^2" --locked
      - name: Update signing (only when the key secret is set)
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.conf.json
            echo "args=--config updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building installers without update files (no latest.json)."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the installers and draft the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Xero Systems Monitor v__VERSION__"
          releaseBody: "Installers for Windows 10 and 11. Windows shows an unknown-publisher warning until the app is code signed."
          releaseDraft: true
          prerelease: false
          args: ${{ steps.updater.outputs.args }}
